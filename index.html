<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tech-Wave</title>

    <!-- Tailwind css -->
     <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- Tailwind css -->

    <!-- css link -->
     <link rel="stylesheet" href="./styles/style.css">
    <!-- css link -->

    <!-- font awosome -->
     <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />

<body class="inter-font">
    <header>
        <nav class="bg-[#1A0B2E] p-6 stroke-[#412567]">
            <!-- nav-container -->
            <div class="container-max-width mx-auto flex justify-between items-center flex-wrap">
                <!-- logo -->
                <div>
                    <h2 class="text-4xl font-extrabold text-[#FFFFFF]">Tech<span class="text-[#DB489F]">Wave</span></h2>
                </div>
                <!-- nav-item -->
                <div>
                    <ul class="flex gap-8 text-[1rem] leading-[120%] text-[#FFFFFF] font-medium items-center">
                        <li class="hidden md:inline"><a href="">About</a></li>
                        <li class="hidden md:inline"><a href="">Episodes</a></li>
                        <li class="hidden md:inline"><a href="">Host</a></li>
                        <li class="md:hidden"><i class="fa-solid fa-bars-staggered text-2xl "></i></li>
                    </ul>

                </div>
                <!-- btn -->
                <div class="hidden md:inline">
                    <button class="primary-gradient py-3 px-4 rounded-[10000px] text-[1rem] font-semibold text-[#FFFFFF] cursor-pointer">Subscribe <i class="fa-solid fa-arrow-right-long ml-1"></i></button>
                </div>
            </div>
        </nav>
        <!-- hero-section -->
        <section class="bg-[url(./assets/hero-bg.png)] bg-no-repeat bg-cover bg-center py-[101px]">
            <!-- hero-container -->
             <div class="container-max-width mx-auto text-center">
                <!-- hero-image -->
                <div class="h-[350px] max-w-[350px] mx-auto bg-[url(./assets/hero-circle.png)] bg-no-repeat bg-center flex justify-center bg-cover items-center relative">
                    <div class="py-2 px-4 bg-[#00FF88] rounded-[10000px] text-[1.1rem] font-semibold shadow-xl/30 shadow-[#00FF88] absolute top-0 right-[23px]">
                        <h3>NEW</h3>
                    </div>
                    <img src="./assets/microphone.png" alt="" class="max-h-[200px]">

                </div>
                <!-- hero-content -->
                <div class="my-10">
                    <h1 class=" text-5xl sm:text-6xl font-extrabold text-[#FFFFFF]">TechWave</h1>
                    <p class="paragraph my-4">Your daily dose of tech insights, productivity hacks, and personal growth</p>
                    <!-- button -->
                     <div class="flex gap-2 justify-center flex-wrap">
                        <button class="primary-gradient py-3 px-5 rounded-[10000px] text-[1rem] font-semibold text-[#FFFFFF] cursor-pointer my-6"><img src="./assets/spotify.png" alt="" class="inline mr-2"> Listen on Spotify</button>
                        <button class="py-3 px-5 rounded-[10000px] text-[1rem] font-semibold text-[#FFFFFF] cursor-pointer my-6 border-[#00FF88] border-1"><img src="./assets/message.png" alt="" class="inline mr-2"> Subscribe</button>
                     </div>

                </div>
             </div>

        </section>
        <!-- hero-section -->

    </header>

    </main>
